<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mindmap</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27%235b8def%27/%3E%3Cg stroke=%27%23fff%27 stroke-width=%272%27 fill=%27%23fff%27%3E%3Cpath d=%27M16 16L8 9M16 16l8-7M16 16l-8 7M16 16l8 7%27/%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%274%27/%3E%3Ccircle cx=%278%27 cy=%279%27 r=%272.5%27/%3E%3Ccircle cx=%2724%27 cy=%279%27 r=%272.5%27/%3E%3Ccircle cx=%278%27 cy=%2723%27 r=%272.5%27/%3E%3Ccircle cx=%2724%27 cy=%2723%27 r=%272.5%27/%3E%3C/g%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Saira:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- ============ LIBRARY ============ -->
  <section id="home" class="view" hidden>
    <header class="topbar">
      <div class="topbar-left">
        <a class="brand" href="#/">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M12 12L5 6M12 12l7-6M12 12l-7 6M12 12l7 6"/><circle cx="12" cy="12" r="3.2"/><circle cx="5" cy="6" r="2"/><circle cx="19" cy="6" r="2"/><circle cx="5" cy="18" r="2"/><circle cx="19" cy="18" r="2"/></svg>
          </span>
          <span class="brand-name">Mindmap</span>
        </a>
      </div>
      <div class="topbar-center">
        <label class="search">
          <span data-icon="search"></span>
          <input id="search" type="search" placeholder="Search your maps" autocomplete="off" spellcheck="false">
        </label>
      </div>
      <div class="topbar-right">
        <button class="icon-btn theme-toggle" title="Toggle theme" data-icon="sun"></button>
        <button id="new-map" class="btn primary" data-icon="plus">New map</button>
      </div>
    </header>

    <main class="library">
      <div class="library-head">
        <h1>Your mind maps</h1>
        <span id="map-count" class="muted"></span>
      </div>
      <div id="cards" class="cards"></div>
      <div id="empty" class="empty" hidden>
        <div class="empty-art">
          <svg viewBox="0 0 120 80"><g stroke="currentColor" stroke-width="1.5" fill="none" opacity=".55"><path d="M60 40H30M60 40H90M30 40l-8-16M30 40l-8 16M90 40l8-16M90 40l8 16"/></g><rect x="44" y="31" width="32" height="18" rx="6" fill="currentColor"/><rect x="14" y="34" width="16" height="12" rx="4" fill="currentColor" opacity=".6"/><rect x="90" y="34" width="16" height="12" rx="4" fill="currentColor" opacity=".6"/><rect x="8" y="16" width="14" height="10" rx="4" fill="currentColor" opacity=".35"/><rect x="8" y="54" width="14" height="10" rx="4" fill="currentColor" opacity=".35"/><rect x="98" y="16" width="14" height="10" rx="4" fill="currentColor" opacity=".35"/><rect x="98" y="54" width="14" height="10" rx="4" fill="currentColor" opacity=".35"/></svg>
        </div>
        <h2>No maps yet</h2>
        <p>Create your first mind map. Everything you type is saved automatically.</p>
        <button class="btn primary" id="empty-new" data-icon="plus">Create a mind map</button>
      </div>
    </main>
  </section>

  <!-- ============ EDITOR ============ -->
  <section id="editor" class="view" hidden>
    <header class="topbar">
      <div class="topbar-left">
        <button id="back" class="icon-btn" title="Back to library" data-icon="arrow-left"></button>
        <span class="brand-mark small" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M12 12L5 6M12 12l7-6M12 12l-7 6M12 12l7 6"/><circle cx="12" cy="12" r="3.2"/><circle cx="5" cy="6" r="2"/><circle cx="19" cy="6" r="2"/><circle cx="5" cy="18" r="2"/><circle cx="19" cy="18" r="2"/></svg>
        </span>
        <input id="map-title" class="title-input" spellcheck="false" autocomplete="off" placeholder="Untitled map">
      </div>
      <div class="topbar-center">
        <span id="save-status" class="save-status is-saved"><span class="dot"></span><span class="label">All changes saved</span></span>
      </div>
      <div class="topbar-right">
        <div class="btn-group">
          <button id="undo" class="icon-btn" title="Undo" data-icon="undo"></button>
          <button id="redo" class="icon-btn" title="Redo" data-icon="redo"></button>
        </div>
        <div class="btn-group">
          <button id="zoom-out" class="icon-btn" title="Zoom out" data-icon="minus"></button>
          <button id="zoom-level" class="zoom-label" title="Reset zoom">100%</button>
          <button id="zoom-in" class="icon-btn" title="Zoom in" data-icon="plus"></button>
          <button id="zoom-fit" class="icon-btn" title="Fit to screen" data-icon="fit"></button>
        </div>
        <button id="notes-btn" class="icon-btn" title="Notes (⌘I)" data-icon="note"></button>
        <button id="help-btn" class="icon-btn" title="Keyboard shortcuts" data-icon="help"></button>
        <button class="icon-btn theme-toggle" title="Toggle theme" data-icon="sun"></button>
      </div>
    </header>

    <div class="editor-body">
    <div id="viewport" class="viewport">
      <div id="world" class="world">
        <svg id="links" class="links"></svg>
        <div id="nodes" class="nodes"></div>
      </div>
      <div id="stylebar" class="stylebar" hidden>
        <button class="sb-btn" data-sb="bg" title="Fill color"><span class="sb-swatch" id="sb-bg-swatch"></span></button>
        <button class="sb-btn" data-sb="color" title="Text color"><span class="sb-a" id="sb-color-swatch">A</span></button>
        <span class="sb-sep"></span>
        <button class="sb-btn" data-sb="bold" title="Bold (⌘B)"><b>B</b></button>
        <button class="sb-btn" data-sb="strike" title="Strikethrough (⌘⇧X)"><s>S</s></button>
        <span class="sb-sep"></span>
        <button class="sb-btn" data-sb="copy" title="Copy style (⌘⇧C)" data-icon="roller"></button>
        <button class="sb-btn" data-sb="paste" title="Paste style (⌘⇧V)" data-icon="paste"></button>
        <button class="sb-btn" data-sb="clear" title="Clear style" data-icon="eraser"></button>
        <div class="sb-pop" id="sb-pop" hidden></div>
      </div>
      <div class="hintbar" id="hintbar">
        <span><kbd>Tab</kbd> child</span>
        <span><kbd>Enter</kbd> sibling</span>
        <span><kbd>Type</kbd> to edit</span>
        <span><kbd>⌫</kbd> delete</span>
        <span><kbd>?</kbd> all shortcuts</span>
      </div>
      <div class="map-stats" id="map-stats"></div>
    </div>

    <aside id="notes-pane" class="notes-pane" hidden>
      <div class="notes-head">
        <span class="notes-label" data-icon="note">Notes</span>
        <button id="notes-close" class="icon-btn" title="Close notes" data-icon="x"></button>
      </div>
      <div class="notes-body">
        <div class="notes-empty" id="notes-empty">Select a node to read or write its notes.</div>
        <div id="notes-content" hidden>
          <div class="notes-node" id="notes-node"></div>
          <div class="notes-meta" id="notes-meta"></div>
          <textarea id="notes-input" class="notes-input" placeholder="Write notes for this node. Context, links, decisions, anything that doesn't belong in the node text." spellcheck="true"></textarea>
          <div class="notes-foot"><span id="notes-count"></span><span>Saved automatically</span></div>
        </div>
      </div>
    </aside>
    </div>

    <aside id="help" class="help" hidden>
      <div class="help-head">
        <h3>Keyboard shortcuts</h3>
        <button id="help-close" class="icon-btn" title="Close" data-icon="x"></button>
      </div>
      <div class="help-body" id="help-body"></div>
    </aside>
  </section>

  <!-- offscreen text measurer (must share node styles) -->
  <div id="measure" class="node measure depth-n"><span class="node-text"></span></div>

  <script src="js/store.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
